<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - PUBG Mobile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>PUBG MOBILE</h2>
        <nav>
            <a href="index.html">Acasă</a>
            <a href="joc.html">Despre joc</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main class="page">
        <h1>Contact</h1>
        <p>
            Ai întrebări despre proiectul PUBG Mobile?
            Completează formularul de mai jos.
        </p>
        <form action="#" method="get">
            <label for="nume">Nume:</label>
            <input type="text" id="nume" name="nume" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="mesaj">Mesaj:</label>
            <textarea id="mesaj" name="mesaj" rows="5" required></textarea>
            <button class="button" type="submit">Trimite</button>
        </form>
        <div class="official">
            <h2>Link util</h2>
            <p>
                <a href="https://www.pubgmobile.com/en-US/home.shtml"
                    target="_blank" rel="noopener noreferrer">
                    Accesează site-ul oficial PUBG Mobile
                </a>
            </p>
        </div>
    </main>
    <footer>
        <p>Proiect realizat în HTML și CSS despre PUBG Mobile.</p>
    </footer>
</body>
</html>
